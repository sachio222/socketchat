[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sachio222/socketchat_v4"
authors = ["sachio222"]

[workspace.dependencies]
socketchat-proto = { path = "crates/socketchat-proto" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
base64 = "0.22"
proptest = "1"
socketchat-core = { path = "crates/socketchat-core" }
socketchat-server = { path = "crates/socketchat-server" }
socketchat-testkit = { path = "crates/socketchat-testkit" }
openmls = { version = "=0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = "0.6"
openmls_sqlite_storage = { version = "=0.3.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
zeroize = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
toml = "=1.1.5"
img-parts = "=0.4.0"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
qrcode = { version = "=0.14.1", default-features = false }
insta = "=1.48.0"
clap = { version = "=4.6.6", features = ["derive"] }
rpassword = "=7.5.4"
directories = "=6.0.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
socketchat-tui = { path = "crates/socketchat-tui" }

# Crypto in dependencies is slow unoptimized; tests run with it optimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
strip = true
codegen-units = 1
