[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sachio222/socketchat_v4"
authors = ["sachio222"]

[workspace.dependencies]
socketchat-proto = { path = "crates/socketchat-proto" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
base64 = "0.22"
proptest = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
