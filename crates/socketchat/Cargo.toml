[package]
name = "socketchat"
description = "Encrypted group chat with a server you run yourself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[[bin]]
name = "socketchat"
path = "src/main.rs"

[features]
# Build SQLCipher's OpenSSL from source, for machines without libssl-dev.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
socketchat-core.workspace = true
socketchat-server.workspace = true
socketchat-tui.workspace = true
socketchat-proto.workspace = true
clap.workspace = true
rpassword.workspace = true
directories.workspace = true
tokio.workspace = true
rusqlite.workspace = true

[dev-dependencies]
# Tests make a profile the way 0.5.0 could, with an empty passphrase.
socketchat-core = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true
rand_core.workspace = true
