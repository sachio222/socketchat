# The profile folder check asks the system which account this app runs as.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Hooks that let tests act as a hostile member, break a group on purpose, or
# make a profile the way 0.5.0 could. socketchat-testkit and the socketchat
# crate's tests turn this on.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
