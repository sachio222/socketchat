name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64, against the system OpenSSL from libssl-dev.
          - os: ubuntu-24.04
            features: ""
          # Apple silicon Mac. SQLCipher uses Apple's CommonCrypto here.
          - os: macos-14
            features: ""
          # Intel Mac. GitHub retired macos-13; macos-15-intel replaces it.
          - os: macos-15-intel
            features: ""
          # Windows has no system OpenSSL, so build it from source, as releases do.
          - os: windows-latest
            features: "--features socketchat/vendored-openssl"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings on Windows (snapshot tests compare text)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install OpenSSL headers (SQLCipher needs them on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Use Strawberry Perl for the OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked ${{ matrix.features }}

  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  crate-age:
    name: Crate release ages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check crate release ages when a lock file or the allow list changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE" HEAD -- Cargo.lock fuzz/Cargo.lock scripts/crate-age-allow.txt; then
            echo "The lock files and the allow list are unchanged."
          else
            sh scripts/crate-age-check.sh
            sh scripts/crate-age-check.sh --lock fuzz/Cargo.lock
          fi
      - run: sh scripts/crate-age-check-test.sh

  # Release and CI workflow rules: actions pinned by commit, --locked cargo
  # commands, read-only jobs except the release host, and the repository
  # token only on the step that creates the release.
  workflows:
    name: Workflow rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: sh scripts/workflow-check-test.sh
      - run: sh scripts/release-binary-check-test.sh
      - run: sh scripts/workflow-check.sh .github/workflows/*.yml

  aarch64:
    name: Build for Linux aarch64 (Raspberry Pi)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p socketchat
      - run: cargo test --workspace --release --locked

  # Release binaries (release.yml, configured in dist-workspace.toml) build
  # OpenSSL from source and link it in. Check that build on every push, on the
  # Ubuntu 22.04 the release uses, with no libssl-dev installed, and check the
  # binary loads no OpenSSL library at run time.
  vendored:
    name: Release-style build (no system OpenSSL)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --profile dist --locked -p socketchat --features vendored-openssl
      - name: Binary needs no libssl or libcrypto
        run: |
          ldd target/dist/socketchat
          if ldd target/dist/socketchat | grep -E 'libssl|libcrypto'; then
            echo "The release binary must not load a system OpenSSL."
            exit 1
          fi
      - name: Binary starts and sets up a server
        run: |
          target/dist/socketchat --version
          target/dist/socketchat server init --data-dir "$RUNNER_TEMP/srv" --host 127.0.0.1
      - name: Binary holds no test-only code
        run: sh scripts/release-binary-check.sh target/dist/socketchat

  fuzz:
    name: Fuzz the frame decoder (60 s)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (no release tags)
        with:
          toolchain: nightly
      # rust-toolchain.toml pins 1.98.1 for the repo; cargo-fuzz needs nightly,
      # so ask for it by name.
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz has no --locked; fetching with it first stops the run when
      # fuzz/Cargo.lock is out of date, so the fuzz build uses it unchanged.
      - run: cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo +nightly fuzz run frame_decoder -- -max_total_time=60
