[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap the release publishes the formula to, and its name there
tap = "sachio222/homebrew-tap"
formula = "socketchat"
# Jobs to run after the release is published
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in: ~/.local/bin unless XDG says otherwise.
# People installing socketchat may not have Rust, so ~/.cargo/bin would be a surprise.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program. None: socketchat update prints
# the command that installs the new version instead.
install-updater = false
# What the installer says when it finishes. The shell and PowerShell
# installers print it inside double quotes, so it must not hold a double
# quote, a $ or a backtick.
install-success-msg = """
Socketchat is installed. Open a new terminal, then:
  socketchat server init                    set up a local server
  socketchat server run                     start a local server
  socketchat join '<invite link>'           join a server you were invited to
  socketchat                                open the chat screen
For a server friends on other computers can reach, add --host <address> to server init."""
# Build OpenSSL from source and link it in, so SQLCipher needs no system library on any target
features = ["vendored-openssl"]
# Extra steps before each build (relative to .github/workflows)
github-build-setup = "../build-setup.yml"
# Build only the socketchat package, so a feature that a test crate turns on
# (socketchat-core's test-hooks) never reaches a release binary
precise-builds = true
# Attest every release file in the host job, which compiles nothing
github-attestations = true
github-attestations-phase = "host"
# release.yml is edited by hand after generating: dist always gives the whole
# workflow write access and the repository token in every job's env, and has
# no setting to narrow them. The edits are listed at the top of release.yml;
# scripts/workflow-check.sh in ci.yml fails if one goes missing.
allow-dirty = ["ci"]

# Actions by full commit, so a moved tag runs nothing new. Bump them together
# with the commits in .github/workflows/release.yml and ci.yml.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
